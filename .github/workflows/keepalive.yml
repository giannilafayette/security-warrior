name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 12 * * *'    # every day at 12:00 UTC
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset the inactivity timer
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API counts as activity and resets that timer.
      - name: Keep scheduled workflows enabled
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/keepalive.yml/enable"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/send-reminders.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
